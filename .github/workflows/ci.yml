name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: ["8.2", "8.3"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run tests
        run: composer test

      - name: Verify seed datasets
        run: php -r "require 'vendor/autoload.php'; \$m = ML\\IDEA\\Dataset\\Registry\\DatasetIntegrity::missingSeedDatasets(); if (\$m !== []) { fwrite(STDERR, 'Missing seed datasets: '.implode(', ', \$m).PHP_EOL); exit(1); }"
